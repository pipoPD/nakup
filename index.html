  <script type="module">
    import { firebaseConfig } from "./firebase-config.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, collection, onSnapshot, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // Údaje sú vo Firebase (projekt mackine-torty):
    //   apps/nakup               -> { master: [{key, title}] }   naučené poradie tovaru
    //   apps/nakup/items/{id}    -> { title, amount, store, completed, pos }
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
    const cfgRef = doc(db, 'apps', 'nakup');
    const itemsCol = collection(db, 'apps', 'nakup', 'items');

    let items = [];
    let masterOrder = [];
    let currentFilter = 'active';
    let isReorderMode = false;
    let isShopMode = false;
    try { isShopMode = localStorage.getItem('nakup_shop_mode') === '1'; } catch (e) {}
    let wakeLock = null;
    let pendingModalAction = null;
    let sortableInstance = null;
    let unsubs = [];
    let loaded = false;
    let isDragging = false;
    let renderPending = false;

    function toast(text) {
      const el = document.getElementById('toast');
      document.getElementById('toast-text').textContent = text;
      el.classList.remove('hidden');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => el.classList.add('hidden'), 4000);
    }
    function fail(err) {
      console.error(err);
      toast('Chyba: ' + ((err && err.code) || (err && err.message) || 'uloženie zlyhalo'));
    }

    function newId() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function plural(n) {
      if (n === 1) return 'položka';
      if (n >= 2 && n <= 4) return 'položky';
      return 'položiek';
    }

    // Čistí kľúč od diakritiky aj od čísel/jednotiek na konci, aby "rozky 10" aj "rozky 5" mali rovnaký kľúč "rozky"
    function normalizeKey(str) {
      if (!str) return '';
      let clean = str.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      clean = clean.replace(/[\s,]+(\d+(?:[.,]\d+)?\s*(?:ks|kus|kusy|kusov|g|gramov|kg|kil|kila|kilo|kíl|dkg|deka|l|liter|litre|litrov|ml|dcl|bal|balenie|balenia|balení)?)$/i, '').trim();
      return clean;
    }

    // Automaticky oddelí názov tovaru a číslo/množstvo zadané priamo do hlavného poľa
    function extractTitleAndAmount(rawTitle, rawAmount) {
      let title = rawTitle.trim();
      let amount = (rawAmount || '').trim();

      if (!amount) {
        const match = title.match(/^(.*?)[\s,]+(\d+(?:[.,]\d+)?\s*(?:ks|kus|kusy|kusov|g|gramov|kg|kil|kila|kilo|kíl|dkg|deka|l|liter|litre|litrov|ml|dcl|bal|balenie|balenia|balení)?)$/i);
        if (match && match[1].trim().length > 0) {
          title = match[1].trim();
          amount = match[2].trim();
          // Ak používateľ zadal len čisté číslo (napr. 10), pridáme "ks" pre prehľadnosť
          if (/^\d+$/.test(amount)) {
            amount = amount + ' ks';
          }
        }
      }

      return { title, amount };
    }

    function saveMasterOrder() {
      setDoc(cfgRef, { master: masterOrder }, { merge: true }).catch(fail);
    }

    function rememberTitle(title) {
      const key = normalizeKey(title);
      if (key && !masterOrder.some(m => m.key === key)) {
        masterOrder.push({ key: key, title: title });
        saveMasterOrder();
      }
    }

    function recordCurrentOrderToMaster() {
      items.forEach(item => {
        const key = normalizeKey(item.title);
        if (!key) return;
        if (!masterOrder.find(m => m.key === key)) {
          masterOrder.push({ key: key, title: item.title });
        }
      });

      const currentActiveKeys = items.map(i => normalizeKey(i.title)).filter(k => k);
      masterOrder.sort((a, b) => {
        const idxA = currentActiveKeys.indexOf(a.key);
        const idxB = currentActiveKeys.indexOf(b.key);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return 0;
      });

      saveMasterOrder();
    }

    function findLearnedInsertIndex(newTitle) {
      const newKey = normalizeKey(newTitle);
      if (!newKey) return items.length;

      const masterIndex = masterOrder.findIndex(m => m.key === newKey);
      if (masterIndex === -1) return items.length;

      for (let i = masterIndex + 1; i < masterOrder.length; i++) {
        const subsequentKey = masterOrder[i].key;
        const targetIndex = items.findIndex(item => normalizeKey(item.title) === subsequentKey);
        if (targetIndex !== -1) return targetIndex;
      }

      return items.length;
    }

    // Uloží nové poradie: každá položka dostane pos podľa indexu, zapíšu sa len zmenené
    function persistOrder(newItems) {
      const batch = writeBatch(db);
      let changed = 0;
      newItems.forEach((it, i) => {
        const pos = (i + 1) * 1000;
        if (it.pos !== pos) {
          it.pos = pos;
          batch.update(doc(itemsCol, it.id), { pos: pos });
          changed++;
        }
      });
      items = newItems;
      if (changed) batch.commit().catch(fail);
    }

    // "mlieko, chlieb a vajcia 10" -> ["mlieko", "chlieb", "vajcia 10"]
    function splitEntries(raw) {
      return raw.split(/\s*[,;]\s*|\s+a\s+/i).map(s => s.trim()).filter(s => s.length > 0);
    }

    function addOne(rawTitle, rawAmount, store) {
      const parsed = extractTitleAndAmount(rawTitle, rawAmount);
      if (!parsed.title) return;
      const insertIndex = findLearnedInsertIndex(parsed.title);

      // pos medzi susedmi, aby nebolo treba prečíslovať celý zoznam
      const before = items[insertIndex - 1];
      const after = items[insertIndex];
      let pos;
      if (!before && !after) pos = 1000;
      else if (!after) pos = (before.pos || 0) + 1000;
      else if (!before) pos = (after.pos || 0) - 1000;
      else pos = ((before.pos || 0) + (after.pos || 0)) / 2;

      const id = newId();
      const data = { title: parsed.title, amount: parsed.amount, store: store || '', completed: false, pos: pos };
      // hneď aj lokálne, aby ďalšia položka z toho istého zadania mala správne miesto
      items.splice(insertIndex, 0, Object.assign({ id: id }, data));
      setDoc(doc(itemsCol, id), data).catch(fail);
      rememberTitle(parsed.title);
    }

    function addEntries(parts, amount, store) {
      if (parts.length === 1) {
        addOne(parts[0], amount || '', store || '');
      } else {
        parts.forEach(p => addOne(p, '', store || ''));
      }
    }

    // Diktovanie: mobil nevloží čiarky, preto "mlieko chlieb vajcia 10" rozdelíme podľa slov.
    // Číslo (a jednotka) ostane pri predchádzajúcej veci, prídavné meno ide s ďalším slovom,
    // tovar z viacerých slov, ktorý už appka pozná, ostane pokope.
    const VOICE_UNIT = /^(ks|kus|kusy|kusov|g|gramov|kg|kil|kila|kilo|kíl|dkg|deka|l|liter|litre|litrov|ml|dcl|bal|balenie|balenia|balení)$/i;
    const VOICE_NUM = /^\d+(?:[.,]\d+)?$/;
    const VOICE_ADJ = /(ý|á|é|í|ie)$/i;
    function splitVoice(transcript) {
      const known = new Set(masterOrder.map(m => m.key));
      const result = [];
      splitEntries(transcript).forEach(segment => {
        const w = segment.split(/\s+/).filter(Boolean);
        let i = 0;
        while (i < w.length) {
          // číslo pred tovarom ("10 rožkov", "2 kg múky") – presunieme ho za tovar
          let lead = [];
          if (VOICE_NUM.test(w[i]) && i + 1 < w.length) {
            lead.push(w[i]); i++;
            if (i + 1 < w.length && VOICE_UNIT.test(w[i])) { lead.push(w[i]); i++; }
          }
          let len = 0;
          // najdlhší známy tovar (max 4 slová)
          for (let n = Math.min(4, w.length - i); n >= 2; n--) {
            if (known.has(normalizeKey(w.slice(i, i + n).join(' ')))) { len = n; break; }
          }
          if (!len) {
            len = 1;
            while (i + len < w.length && VOICE_ADJ.test(w[i + len - 1]) && !VOICE_NUM.test(w[i + len])) len++;
          }
          let part = w.slice(i, i + len);
          i += len;
          if (lead.length) {
            part = part.concat(lead);
          } else if (i < w.length && VOICE_NUM.test(w[i])) {
            part.push(w[i]); i++;
            if (i < w.length && VOICE_UNIT.test(w[i])) { part.push(w[i]); i++; }
          }
          // samotné číslo bez tovaru pripojíme k predchádzajúcej položke
          if (VOICE_NUM.test(part[0]) && result.length) {
            result[result.length - 1] += ' ' + part.join(' ');
          } else {
            result.push(part.join(' '));
          }
        }
      });
      return result;
    }

    function addItem() {
      const nameInput = document.getElementById('item-name');
      const amountInput = document.getElementById('item-amount');
      const storeInput = document.getElementById('item-store');

      const rawTitle = nameInput.value.trim();
      if (!rawTitle) return;

      addEntries(splitEntries(rawTitle), amountInput.value, storeInput.value.trim());
      nameInput.value = '';
      amountInput.value = '';
      storeInput.value = '';
      updateSuggestions();
      renderList();
      nameInput.focus();
    }

    // ---- Našepkávanie ----
    function updateSuggestions() {
      const box = document.getElementById('suggestions');
      const value = document.getElementById('item-name').value;
      const parts = value.split(/,|;|\s+a\s+/i);
      const last = (parts[parts.length - 1] || '').trim();
      const q = normalizeKey(last);
      if (q.length < 1) { box.classList.add('hidden'); box.innerHTML = ''; return; }

      const inList = new Set(items.filter(i => !i.completed).map(i => normalizeKey(i.title)));
      const starts = [], contains = [];
      masterOrder.forEach(m => {
        if (!m.key || inList.has(m.key) || m.key === q) return;
        if (m.key.startsWith(q)) starts.push(m);
        else if (m.key.includes(q)) contains.push(m);
      });
      const found = starts.concat(contains).slice(0, 5);

      if (!found.length) { box.classList.add('hidden'); box.innerHTML = ''; return; }
      box.innerHTML = found.map(m => `
        <button type="button" data-title="${escapeHTML(m.title)}" class="suggestion shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-indigo-50 border border-indigo-200 text-indigo-700 text-sm font-bold active:bg-indigo-100">
          <i class="ph-bold ph-plus text-xs"></i>${escapeHTML(m.title)}
        </button>`).join('');
      box.classList.remove('hidden');
    }

    function pickSuggestion(title) {
      const input = document.getElementById('item-name');
      // nahradí posledný rozpísaný kúsok vybraným tovarom (číslo za ním ostane)
      const value = input.value;
      const m = value.match(/^(.*(?:,|;|\s+a\s+))?\s*([^,;]*)$/i);
      const prefix = m && m[1] ? m[1] : '';
      const lastPart = m ? m[2] : value;
      const amountMatch = lastPart.match(/[\s,]+(\d+(?:[.,]\d+)?\s*(?:ks|kus|kusy|kusov|g|gramov|kg|kil|kila|kilo|kíl|dkg|deka|l|liter|litre|litrov|ml|dcl|bal|balenie|balenia|balení)?)$/i);
      input.value = prefix + (prefix ? ' ' : '') + title + (amountMatch ? ' ' + amountMatch[1] : '');
      addItem();
    }

    // ---- Späť ----
    let undoAction = null;
    let undoTimer = null;
    function offerUndo(text, fn) {
      undoAction = fn;
      document.getElementById('undo-text').textContent = text;
      document.getElementById('undo-bar').classList.remove('hidden');
      clearTimeout(undoTimer);
      undoTimer = setTimeout(hideUndo, 5000);
    }
    function hideUndo() {
      undoAction = null;
      document.getElementById('undo-bar').classList.add('hidden');
    }
    function itemData(it) {
      return { title: it.title || '', amount: it.amount || '', store: it.store || '', completed: !!it.completed, pos: it.pos || 0 };
    }
    function restoreItems(list) {
      for (let i = 0; i < list.length; i += 450) {
        const batch = writeBatch(db);
        list.slice(i, i + 450).forEach(it => batch.set(doc(itemsCol, it.id), itemData(it)));
        batch.commit().catch(fail);
      }
    }

    window.toggleComplete = function(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const was = !!item.completed;
      updateDoc(doc(itemsCol, id), { completed: !was }).catch(fail);
      offerUndo(`${item.title} – ${was ? 'vrátené na nákup' : 'v košíku'}`, function() {
        updateDoc(doc(itemsCol, id), { completed: was }).catch(fail);
      });
    };

    window.openEditModal = function(id, e) {
      if (e) e.stopPropagation();
      const item = items.find(i => i.id === id);
      if (!item) return;

      document.getElementById('edit-item-id').value = item.id;
      document.getElementById('edit-item-title').value = item.title;
      document.getElementById('edit-item-amount').value = item.amount || '';
      document.getElementById('edit-item-store').value = item.store || '';

      document.getElementById('edit-modal-backdrop').classList.remove('hidden');
      setTimeout(() => document.getElementById('edit-item-title').focus(), 100);
    };

    window.closeEditModal = function() {
      document.getElementById('edit-modal-backdrop').classList.add('hidden');
    };

    window.deleteItem = function(id, e) {
      if (e) e.stopPropagation();
      const item = items.find(i => i.id === id);
      if (!item) return;
      const copy = Object.assign({}, item);
      deleteDoc(doc(itemsCol, id)).catch(fail);
      offerUndo(`Zmazané: ${copy.title}`, function() { restoreItems([copy]); });
    };

    function moveItem(id, dir) {
      const index = items.findIndex(i => i.id === id);
      const target = index + dir;
      if (index === -1 || target < 0 || target >= items.length) return;
      const newItems = items.slice();
      const temp = newItems[index];
      newItems[index] = newItems[target];
      newItems[target] = temp;
      persistOrder(newItems);
      recordCurrentOrderToMaster();
      renderList();
    }
    window.moveItemUp = function(id, e) { if (e) e.stopPropagation(); moveItem(id, -1); };
    window.moveItemDown = function(id, e) { if (e) e.stopPropagation(); moveItem(id, 1); };

          data-id="${item.id}"

          <!-- Zaškrtnutie a Názov položky -->

              class="w-8 h-8 rounded-xl flex items-center justify-center transition-all shrink-0 ${
                isDone
                  ? 'bg-emerald-500 text-white shadow-sm'
                  : 'border-2 border-slate-400 bg-white text-transparent'
              }"
            >
              <i class="ph-bold ph-check text-base"></i>
            </button>

            <div class="truncate">

                ${item.store ? `<span class="inline-flex items-center text-xs font-semibold text-slate-600 bg-slate-100 px-2.5 py-0.5 rounded-lg border border-slate-200"><i class="ph-bold ph-map-pin mr-1 text-xs"></i>${escapeHTML(item.store)}</span>` : ''}

          </div>

          <!-- Posúvanie a Zmazanie -->
          <div class="flex items-center gap-1.5 ml-2 shrink-0">
            ${isReorderMode ? `
              <button type="button" onclick="window.moveItemUp('${item.id}', event)" title="Hore" class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center active:bg-slate-200">
                <i class="ph-bold ph-caret-up text-sm"></i>
              </button>
              <button type="button" onclick="window.moveItemDown('${item.id}', event)" title="Dole" class="w-10 h-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center active:bg-slate-200">

            <!-- Rukoväť na ťahanie -->
            <div class="drag-handle touch-none w-11 h-11 flex items-center justify-center text-slate-400 hover:text-slate-700 active:text-indigo-600 cursor-grab active:cursor-grabbing">

            <button type="button" onclick="window.openEditModal('${item.id}', event)" title="Upraviť" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-indigo-600 active:text-indigo-600 transition">
              <i class="ph-bold ph-pencil-simple text-2xl"></i>
            </button>

            <!-- Tlačidlo zmazať -->
            <button type="button" onclick="window.deleteItem('${item.id}', event)" title="Vymazať" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-rose-600 active:text-rose-600 transition">
              <i class="ph-bold ph-trash text-2xl"></i>

    }

    // Karta v režime do obchodu: veľké písmo, celé ťuknutie odškrtne, potiahnutie doprava odškrtne
    function shopCard(item) {
      const isDone = item.completed;
      return `
        <div data-id="${item.id}" class="item-card shop-card flex items-center gap-4 p-5 rounded-3xl border-2 transition-all duration-150 select-none ${
          isDone ? 'bg-slate-50 border-slate-200 opacity-60' : 'bg-white border-slate-200 shadow-sm active:border-emerald-400'
        }">
          <div class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0 ${
            isDone ? 'bg-emerald-500 text-white' : 'border-[3px] border-slate-400 bg-white text-transparent'
          }">
            <i class="ph-bold ph-check text-xl"></i>
          </div>
          <div class="min-w-0 flex-1">
            <div class="text-2xl font-extrabold leading-tight break-words ${isDone ? 'line-through text-slate-400' : 'text-slate-900'}">${escapeHTML(item.title)}</div>
            ${(item.amount || item.store) ? `<div class="flex items-center gap-2 mt-2 flex-wrap">
              ${item.amount ? `<span class="inline-flex items-center text-base font-extrabold text-indigo-700 bg-indigo-50 px-3 py-1 rounded-xl border border-indigo-200/50">${escapeHTML(item.amount)}</span>` : ''}
              ${item.store ? `<span class="inline-flex items-center text-sm font-bold text-slate-600 bg-slate-100 px-3 py-1 rounded-xl border border-slate-200"><i class="ph-bold ph-map-pin mr-1"></i>${escapeHTML(item.store)}</span>` : ''}
            </div>` : ''}
          </div>
        </div>
      `;
    }

    function renderList() {
      if (isDragging) { renderPending = true; return; }

      const listEl = document.getElementById('items-list');
      const emptyState = document.getElementById('empty-state');
      const emptyTitle = document.getElementById('empty-title');
      const emptyDesc = document.getElementById('empty-desc');
      const headerCounter = document.getElementById('header-counter');

      const filtered = items.filter(item => currentFilter === 'completed' ? item.completed : !item.completed);

      const activeCount = items.filter(i => !i.completed).length;
      headerCounter.textContent = loaded ? `${activeCount} ${plural(activeCount)} na nákup` : 'Načítavam…';

      if (!loaded) {
        listEl.innerHTML = '';
        emptyState.classList.add('hidden');
      } else if (filtered.length === 0) {
        listEl.innerHTML = '';
        emptyState.classList.remove('hidden');
        if (currentFilter === 'completed') {
          emptyTitle.textContent = 'Košík je prázdny';
          emptyDesc.textContent = 'Zatiaľ si do košíka neodškrtol žiadnu položku.';
        } else {
          emptyTitle.textContent = 'Všetko nakúpené!';
          emptyDesc.textContent = 'Nemáš žiadne čakajúce položky na nákup.';
        }
      } else {
        emptyState.classList.add('hidden');
        listEl.innerHTML = filtered.map((item) => isShopMode ? shopCard(item) : normalCard(item)).join('');
      }

      setupSortable();
    }

    function setupSortable() {
      const el = document.getElementById('items-list');
      if (sortableInstance) { sortableInstance.destroy(); sortableInstance = null; }
      if (isShopMode) return;

      sortableInstance = new Sortable(el, {
        handle: '.drag-handle',
        animation: 180,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        delay: 40,
        delayOnTouchOnly: true,
        onStart: function () { isDragging = true; },
        onEnd: function () {
          isDragging = false;
          const newOrderedIds = Array.from(el.querySelectorAll('.item-card')).map(elem => elem.getAttribute('data-id'));

          const newItems = [];
          newOrderedIds.forEach(id => {
            const found = items.find(i => i.id === id);
            if (found) newItems.push(found);
          });
          items.forEach(it => {
            if (!newItems.find(n => n.id === it.id)) newItems.push(it);
          });

          persistOrder(newItems);
          recordCurrentOrderToMaster();
          if (renderPending) { renderPending = false; renderList(); }
        }
      });
    }

    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    function showConfirmModal(title, desc, onConfirm) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-desc').textContent = desc;
      pendingModalAction = onConfirm;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }

    function hideModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
      pendingModalAction = null;
    }

    function deleteMany(list) {
      // Firestore dávka má limit 500 operácií
      for (let i = 0; i < list.length; i += 450) {
        const batch = writeBatch(db);
        list.slice(i, i + 450).forEach(it => batch.delete(doc(itemsCol, it.id)));
        batch.commit().catch(fail);
      }
    }

    // ---- Firebase: načítanie a živé zmeny ----
    function start() {
      if (unsubs.length) return;
      unsubs.push(onSnapshot(itemsCol, { includeMetadataChanges: true }, function(snap) {
        const arr = [];
        snap.forEach(d => { const o = d.data(); o.id = d.id; arr.push(o); });
        arr.sort((a, b) => (a.pos || 0) - (b.pos || 0) || (a.id < b.id ? -1 : 1));
        items = arr;
        loaded = true;
        document.getElementById('offline-badge').classList.toggle('hidden', !snap.metadata.fromCache);
        renderList();
      }, fail));
      unsubs.push(onSnapshot(cfgRef, function(snap) {
        masterOrder = (snap.exists() && snap.data().master) || [];
      }, fail));
    }

    function stop() {
      unsubs.forEach(u => u());
      unsubs = [];
      items = [];
      masterOrder = [];
      loaded = false;
      renderList();
    }

    // ---- Režim do obchodu ----
    async function requestWakeLock() {
      try {
        if (isShopMode && 'wakeLock' in navigator && document.visibilityState === 'visible' && !wakeLock) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => { wakeLock = null; });
        }
      } catch (e) { wakeLock = null; }
    }
    function releaseWakeLock() {
      if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
    }
    function applyShopMode() {
      const btn = document.getElementById('shop-mode-btn');
      btn.classList.toggle('bg-emerald-500', isShopMode);
      btn.classList.toggle('text-white', isShopMode);
      btn.classList.toggle('border-emerald-500', isShopMode);
      // v obchode sa poradie nemení
      document.getElementById('toggle-reorder-btn').classList.toggle('hidden', isShopMode);
      if (isShopMode) { isReorderMode = false; requestWakeLock(); } else { releaseWakeLock(); }
      renderList();
    }

    function setupShopGestures() {
      const list = document.getElementById('items-list');
      let card = null, startX = 0, startY = 0, dx = 0, swiping = false, suppressClick = false;

      list.addEventListener('click', function(e) {
        if (!isShopMode) return;
        const c = e.target.closest('.shop-card');
        if (!c) return;
        if (suppressClick) { suppressClick = false; return; }
        window.toggleComplete(c.getAttribute('data-id'));
      });

      list.addEventListener('touchstart', function(e) {
        if (!isShopMode || e.touches.length !== 1) return;
        card = e.target.closest('.shop-card');
        if (!card) return;
        startX = e.touches[0].clientX; startY = e.touches[0].clientY; dx = 0; swiping = false;
      }, { passive: true });

      list.addEventListener('touchmove', function(e) {
        if (!card) return;
        const mx = e.touches[0].clientX - startX;
        const my = e.touches[0].clientY - startY;
        if (!swiping) {
          if (Math.abs(my) > 12 && Math.abs(my) > Math.abs(mx)) { card = null; return; }
          if (mx > 12 && mx > Math.abs(my)) { swiping = true; card.classList.add('swiping'); }
        }
        if (swiping) {
          dx = Math.max(0, mx);
          card.style.transform = `translateX(${dx}px)`;
          card.style.backgroundColor = dx > 90 ? '#d1fae5' : '';
        }
      }, { passive: true });

      function endSwipe() {
        if (!card) return;
        const c = card; card = null;
        c.classList.remove('swiping');
        c.style.transform = '';
        c.style.backgroundColor = '';
        if (swiping) {
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 400);
          if (dx > 90) window.toggleComplete(c.getAttribute('data-id'));
        }
        swiping = false;
      }
      list.addEventListener('touchend', endSwipe);
      list.addEventListener('touchcancel', endSwipe);
    }

    function initAuth() {
      const lg = document.getElementById('login');
      const msg = document.getElementById('login-msg');
      const form = document.getElementById('login-form');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        msg.textContent = 'Prihlasujem…';
        signInWithEmailAndPassword(auth, document.getElementById('login-email').value.trim(), document.getElementById('login-pass').value)
          .catch(() => { msg.textContent = 'Nesprávny e-mail alebo heslo.'; });
      });

      document.getElementById('logout-btn').addEventListener('click', function() {
        document.getElementById('more-menu').classList.add('hidden');
        signOut(auth);
      });

      onAuthStateChanged(auth, function(u) {
        if (u) {
          lg.classList.add('hidden');
          start();
        } else {
          stop();
          lg.classList.remove('hidden');
          form.classList.remove('hidden');
          if (msg.textContent !== 'Nesprávny e-mail alebo heslo.') msg.textContent = 'Prihlás sa.';
        }
      });
    }

    // ---- Ovládanie ----
    function initUI() {
      // Hlasové zadávanie (Web Speech API)
      const voiceBtn = document.getElementById('voice-input-btn');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'sk-SK';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        let isListening = false;

        voiceBtn.addEventListener('click', function() {
          if (isListening) { recognition.stop(); return; }
          try { recognition.start(); } catch (err) { console.error('Speech recognition error:', err); }
        });
        recognition.onstart = function() {
          isListening = true;
          voiceBtn.classList.remove('bg-slate-100', 'text-slate-600');
          voiceBtn.classList.add('bg-rose-500', 'text-white', 'animate-pulse');
        };
        recognition.onresult = function(event) {
          const transcript = event.results[0][0].transcript;
          if (transcript) {
            addEntries(splitVoice(transcript), '', '');
            updateSuggestions();
            renderList();
          }
        };
        recognition.onerror = function(event) { console.warn('Speech error:', event.error); };
        recognition.onend = function() {
          isListening = false;
          voiceBtn.classList.remove('bg-rose-500', 'text-white', 'animate-pulse');
          voiceBtn.classList.add('bg-slate-100', 'text-slate-600');
        };
      } else {
        voiceBtn.style.display = 'none';
      }

      document.getElementById('shop-mode-btn').addEventListener('click', function() {
        isShopMode = !isShopMode;
        try { localStorage.setItem('nakup_shop_mode', isShopMode ? '1' : '0'); } catch (e) {}
        applyShopMode();
      });
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') requestWakeLock();
      });
      setupShopGestures();

      document.getElementById('item-name').addEventListener('input', updateSuggestions);
      document.getElementById('suggestions').addEventListener('click', function(e) {
        const b = e.target.closest('.suggestion');
        if (b) pickSuggestion(b.getAttribute('data-title'));
      });
      document.getElementById('undo-btn').addEventListener('click', function() {
        const fn = undoAction;
        hideUndo();
        if (typeof fn === 'function') fn();
      });

      document.getElementById('add-form').addEventListener('submit', function(e) {
        e.preventDefault();
        addItem();
      });

      const detailsRow = document.getElementById('details-row');
      document.getElementById('toggle-details-btn').addEventListener('click', function(e) {
        e.preventDefault();
        detailsRow.classList.toggle('hidden');
        if (!detailsRow.classList.contains('hidden')) document.getElementById('item-amount').focus();
      });

      document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.addEventListener('click', function(e) {
          document.querySelectorAll('.filter-tab').forEach(t => {
            t.className = 'filter-tab flex-1 py-2.5 rounded-xl text-center font-bold text-base transition text-slate-600 hover:text-slate-900';
          });
          e.target.className = 'filter-tab flex-1 py-2.5 rounded-xl text-center font-bold text-base transition bg-indigo-600 text-white shadow-sm';
          currentFilter = e.target.getAttribute('data-filter');
          renderList();
        });
      });

      const menuBtn = document.getElementById('menu-btn');
      const moreMenu = document.getElementById('more-menu');
      menuBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        moreMenu.classList.toggle('hidden');
      });
      document.addEventListener('click', function(e) {
        if (!moreMenu.contains(e.target) && !menuBtn.contains(e.target)) moreMenu.classList.add('hidden');
      });

      const toggleReorderBtn = document.getElementById('toggle-reorder-btn');
      toggleReorderBtn.addEventListener('click', function() {
        isReorderMode = !isReorderMode;
        toggleReorderBtn.classList.toggle('bg-indigo-600', isReorderMode);
        toggleReorderBtn.classList.toggle('text-white', isReorderMode);
        renderList();
      });

      document.getElementById('clear-completed-btn').addEventListener('click', function() {
        moreMenu.classList.add('hidden');
        const done = items.filter(i => i.completed);
        if (done.length === 0) return;
        showConfirmModal(
          'Vyčistiť vybavené položky?',
          `Odstráni sa ${done.length} ${plural(done.length)}, ktoré už máte v košíku.`,
          function() {
            const copies = done.map(i => Object.assign({}, i));
            deleteMany(done);
            offerUndo(`Vyčistené: ${copies.length} ${plural(copies.length)}`, function() { restoreItems(copies); });
          }
        );
      });

      document.getElementById('clear-all-btn').addEventListener('click', function() {
        moreMenu.classList.add('hidden');
        if (items.length === 0) return;
        showConfirmModal(
          'Vymazať celý zoznam?',
          'Všetky položky budú natrvalo odstránené.',
          function() {
            const copies = items.map(i => Object.assign({}, i));
            deleteMany(items.slice());
            offerUndo(`Zoznam vymazaný (${copies.length} ${plural(copies.length)})`, function() { restoreItems(copies); });
          }
        );
      });

      document.getElementById('modal-confirm').addEventListener('click', function() {
        if (typeof pendingModalAction === 'function') pendingModalAction();
        hideModal();
      });
      document.getElementById('modal-cancel').addEventListener('click', hideModal);

      // Úprava položky
      document.getElementById('edit-item-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const id = document.getElementById('edit-item-id').value;
        const newTitle = document.getElementById('edit-item-title').value.trim();
        if (!newTitle) return;
        if (items.some(i => i.id === id)) {
          updateDoc(doc(itemsCol, id), {
            title: newTitle,
            amount: document.getElementById('edit-item-amount').value.trim(),
            store: document.getElementById('edit-item-store').value.trim()
          }).catch(fail);
          rememberTitle(newTitle);
        }
        window.closeEditModal();
      });
      document.getElementById('edit-modal-cancel').addEventListener('click', window.closeEditModal);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    initUI();
    applyShopMode();
    initAuth();
  </script>
</body>
</html>
